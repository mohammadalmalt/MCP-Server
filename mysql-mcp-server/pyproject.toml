[project]
name = "mysql-mcp-server"
version = "0.1.0"
description = "A secure, production-ready MySQL MCP server for Claude Desktop"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "mysql-connector-python>=8.3.0",
    "sqlparse>=0.4.4",
]

[project.scripts]
mysql-mcp-server = "mysql_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mysql_mcp*"]
